# Gerbang verifikasi otomatis untuk setiap PR dan setiap perubahan di
# develop/main. Tidak bisa dijadikan syarat merge (paket Free + repo private,
# OPEN_DECISIONS D10), tapi hasilnya terlihat di PR sebelum reviewer menyetujui.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transaksi_mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-test-only
          MYSQL_DATABASE: tokokita_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-test-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: mysql://root:ci-test-only@127.0.0.1:3306/tokokita_test
      AUTH_SECRET: rahasia-khusus-ci-transaksi-bukan-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run test:integration
  verifikasi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Skrip yang belum ada (sebelum scaffold) dilewati, bukan dianggap lulus.
      - run: npm run lint --if-present
      # Uji sandbox Midtrans dilewati otomatis (butuh Server Key); tidak ada rahasia di CI.
      - run: npm run test
      # src/lib/db.ts menolak DATABASE_URL kosong saat modul dimuat, dan `next build`
      # memuat modul untuk mengumpulkan konfigurasi halaman. Build tidak pernah
      # membuka koneksi (semua halaman ber-DB dinamis), jadi cukup placeholder ke
      # port mati — bukan kredensial.
      - run: npm run build --if-present
        env:
          DATABASE_URL: mysql://ci:ci@127.0.0.1:1/ci
          APP_URL: https://tokokita.example.invalid
