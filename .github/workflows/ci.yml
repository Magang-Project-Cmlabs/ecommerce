# Gerbang verifikasi otomatis untuk setiap PR dan setiap perubahan di
# develop/main. Tidak bisa dijadikan syarat merge (paket Free + repo private,
# OPEN_DECISIONS D10), tapi hasilnya terlihat di PR sebelum reviewer menyetujui.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifikasi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Skrip yang belum ada (sebelum scaffold) dilewati, bukan dianggap lulus.
      - run: npm run lint --if-present
      # Uji sandbox Midtrans dilewati otomatis (butuh Server Key); tidak ada rahasia di CI.
      - run: npm run test
      - run: npm run build --if-present
